<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nyx">
  <title>Nyx</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2a1f3f"/>
      <stop offset="55%" stop-color="#1a1428"/>
      <stop offset="100%" stop-color="#0a0612"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#BD93F9" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#BD93F9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#BD93F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Disco -->
  <circle cx="128" cy="128" r="125.44" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="125.44" fill="url(#glow)"/>
  <!-- Aro violeta -->
  <circle cx="128" cy="128" r="122.88" fill="none" stroke="#9D4EDD" stroke-width="3.84" stroke-opacity="0.85"/>
  <!-- Realce superior-esquerdo -->
  <path d="M 46.08 81.92 A 97.28 97.28 0 0 1 128 30.72" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3.07" stroke-linecap="round"/>
  <!-- Hastes verticais do N -->
  <g stroke="#BD93F9" stroke-width="8.7" stroke-linecap="square" fill="none">
    <line x1="81.92"  y1="71.68"  x2="81.92"  y2="184.32"/>
    <line x1="174.08" y1="71.68"  x2="174.08" y2="184.32"/>
    <!-- Diagonal interrompida (stencil) -->
    <line x1="81.92"  y1="71.68"  x2="115.20" y2="112.64"/>
    <line x1="140.80" y1="143.36" x2="174.08" y2="184.32"/>
  </g>
  <!-- Pupila central no espaco aberto -->
  <circle cx="128" cy="128" r="11.78" fill="#BD93F9"/>
  <circle cx="128" cy="128" r="5.63"  fill="#0a0612"/>
  <circle cx="124.42" cy="124.42" r="2.05" fill="#ffffff" fill-opacity="0.95"/>
</svg>
