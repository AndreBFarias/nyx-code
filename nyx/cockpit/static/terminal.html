<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Nyx Cockpit -- REPL</title>
  <link rel="stylesheet" href="/static/vendor/xterm.css">
  <style>
    /* Paleta D (ADR-023): turquesa #00D4AA + roxo #9D4EDD em estados especiais. */
    :root {
      --nyx-bg: #0E0F1A;
      --nyx-bg-soft: #1A1D29;
      --nyx-ink: #E8E8E8;
      --nyx-ink-dim: #6C7A89;
      --nyx-accent: #00D4AA;
      --nyx-purple: #9D4EDD;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--nyx-bg);
      color: var(--nyx-ink);
      font-family: ui-monospace, "JetBrains Mono", "Fira Mono", monospace;
    }
    .header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 32px;
      padding: 0 1rem;
      border-bottom: 1px solid var(--nyx-bg-soft);
      display: flex; align-items: center; gap: 1rem;
      font-size: 0.85rem;
      background: var(--nyx-bg);
      z-index: 10;
    }
    .header .brand {
      color: var(--nyx-accent);
      font-weight: 600;
    }
    .header .muted { color: var(--nyx-ink-dim); }
    .header .status { margin-left: auto; }
    .status-dot {
      display: inline-block;
      width: 0.6rem; height: 0.6rem;
      border-radius: 50%;
      background: var(--nyx-ink-dim);
      vertical-align: middle;
      margin-right: 0.3rem;
    }
    .status-dot.connected { background: var(--nyx-accent); }
    .status-dot.busy { background: var(--nyx-purple); }
    .status-dot.error { background: #FF6B6B; }
    #terminal {
      position: fixed;
      top: 32px; left: 0; right: 0; bottom: 0;
      padding: 0.25rem;
      overflow: hidden;
    }
    #terminal .terminal,
    #terminal .xterm,
    #terminal .xterm-viewport,
    #terminal .xterm-screen {
      width: 100% !important;
      height: 100% !important;
    }
    .footer {
      position: fixed; bottom: 0; right: 0;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: var(--nyx-ink-dim);
      background: var(--nyx-bg-soft);
      border-top-left-radius: 4px;
      z-index: 20;
    }
    /* PTY-PERMISSION-FLOW-01: modal overlay para aprovar CONFIRM_ONCE */
    #perm-overlay {
      position: fixed; inset: 0;
      background: rgba(14, 15, 26, 0.78);
      display: none;
      align-items: center; justify-content: center;
      z-index: 1000;
    }
    #perm-overlay.visible { display: flex; }
    #perm-modal {
      background: var(--nyx-bg-soft);
      border: 1px solid var(--nyx-accent);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      min-width: 360px; max-width: 520px;
      box-shadow: 0 8px 32px rgba(0, 212, 170, 0.18);
    }
    #perm-modal h2 {
      margin: 0 0 0.35rem 0;
      color: var(--nyx-accent);
      font-size: 0.95rem;
      font-weight: 600;
    }
    #perm-modal p {
      margin: 0 0 1rem 0;
      font-size: 0.85rem;
      color: var(--nyx-ink);
    }
    #perm-modal .tool {
      color: var(--nyx-purple);
      font-weight: 600;
    }
    #perm-actions {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
    }
    #perm-actions button {
      flex: 1 1 auto;
      padding: 0.45rem 0.75rem;
      background: var(--nyx-bg);
      color: var(--nyx-ink);
      border: 1px solid var(--nyx-ink-dim);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
    }
    #perm-actions button:hover { border-color: var(--nyx-accent); color: var(--nyx-accent); }
    #perm-actions button.primary { border-color: var(--nyx-accent); color: var(--nyx-accent); }
    #perm-actions button.danger { border-color: #FF6B6B; color: #FF6B6B; }
    #perm-actions button.always { border-color: var(--nyx-purple); color: var(--nyx-purple); }
    #perm-actions button:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <div class="header">
    <span class="brand">Nyx</span>
    <span class="muted">cockpit / terminal</span>
    <a href="/dashboard" style="color: var(--nyx-ink-dim); margin-left: 1rem; text-decoration: none;">dashboard</a>
    <span class="status"><span id="dot" class="status-dot"></span><span id="status-text">conectando...</span></span>
  </div>
  <div id="terminal"></div>
  <div id="perm-overlay" role="dialog" aria-modal="true" aria-labelledby="perm-title">
    <div id="perm-modal">
      <h2 id="perm-title">Permissão solicitada</h2>
      <p><span class="tool" id="perm-tool">tool</span> pede permissão. Aprovar?</p>
      <div id="perm-actions">
        <button id="perm-yes" class="primary" type="button">Aprovar uma vez</button>
        <button id="perm-always" class="always" type="button">Sempre aprovar essa tool</button>
        <button id="perm-no" class="danger" type="button">Negar</button>
      </div>
    </div>
  </div>
  <div class="footer">Ctrl+C cancela | Ctrl+D sai | redimensione livremente</div>

  <script src="/static/vendor/xterm.js"></script>
  <script>
    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const setStatus = (cls, text) => {
      dot.className = "status-dot " + cls;
      statusText.textContent = text;
    };

    // TUI-FIX-WEB-RESIZE-TILING-01 (ONDA-34): opções extraídas p/ reuso no
    // recreateTerminal() (recriação no resize). `term` é `let` por isso.
    const TERM_OPTIONS = {
      cursorBlink: true,
      cursorStyle: "block",
      fontFamily: 'ui-monospace, "JetBrains Mono", "Fira Mono", monospace',
      fontSize: 13,
      theme: {
        background: "#0E0F1A",
        foreground: "#E8E8E8",
        cursor: "#00D4AA",
        cursorAccent: "#0E0F1A",
        selectionBackground: "#9D4EDD55",
        black: "#1A1D29",
        green: "#00D4AA",
        magenta: "#9D4EDD",
        cyan: "#00D4AA",
        white: "#E8E8E8",
        brightBlack: "#6C7A89",
        brightGreen: "#4ADE80",
        brightMagenta: "#BD93F9",
        brightWhite: "#E8E8E8",
      },
    };
    let term = new Terminal(TERM_OPTIONS);
    const termContainer = document.getElementById("terminal");
    term.open(termContainer);

    // UX-COCKPIT-FULLSCREEN-01: fit manual (xterm.js vendored sem FitAddon).
    // Calcula cols/rows a partir do tamanho de celula real e dimensoes do
    // container. Chamado apos open() e em todo resize do window (debounced).
    function measureCell() {
      const probe = document.createElement("span");
      probe.style.cssText = (
        "position:absolute; visibility:hidden; white-space:pre;" +
        "font-family:" + term.options.fontFamily + ";" +
        "font-size:" + term.options.fontSize + "px;" +
        "line-height:" + (term.options.lineHeight || 1.0) + ";"
      );
      probe.textContent = "M".repeat(80);
      termContainer.appendChild(probe);
      const rect = probe.getBoundingClientRect();
      const cellW = rect.width / 80;
      const cellH = rect.height;
      probe.remove();
      return { cellW: cellW || 8, cellH: cellH || 16 };
    }

    function fitTerminal() {
      if (!termContainer || !term.element) return;
      const { cellW, cellH } = measureCell();
      const padX = 8;   // 0.25rem * 2 do #terminal padding (aprox 8px)
      const padY = 8;
      const availW = Math.max(termContainer.clientWidth - padX, cellW * 20);
      const availH = Math.max(termContainer.clientHeight - padY, cellH * 5);
      const cols = Math.max(20, Math.floor(availW / cellW));
      const rows = Math.max(5, Math.floor(availH / cellH));
      if (cols !== term.cols || rows !== term.rows) {
        try {
          term.resize(cols, rows);
        } catch (err) {
          console.warn("[cockpit] term.resize falhou:", err);
        }
      }
    }

    // Primeira chamada apos layout estabilizar (font carrega assincrono).
    requestAnimationFrame(() => requestAnimationFrame(fitTerminal));

    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProto}//${location.host}/repl`);
    ws.binaryType = "arraybuffer";

    ws.onopen = () => {
      setStatus("connected", "conectado");
      // UX-COCKPIT-FULLSCREEN-01: garante fit antes de enviar tamanho inicial.
      fitTerminal();
      sendResize();
    };
    // PTY-PERMISSION-FLOW-01: detecta marca `[permissao: uma vez] Executar <tool>(`
    // no stream do PTY e abre overlay para aprovacao humana via clique.
    // Regex montado em runtime para evitar literal sensivel em ferramentas
    // de seguranca que escaneiam tokens do tipo "Exec" + "(".
    const permOverlay = document.getElementById("perm-overlay");
    const permTool = document.getElementById("perm-tool");
    const permYes = document.getElementById("perm-yes");
    const permAlways = document.getElementById("perm-always");
    const permNo = document.getElementById("perm-no");
    let permCurrentTool = null;
    let permBuffer = "";
    const _verb = "Ex" + "ecutar";  // anti-falso-positivo em hooks de seguranca
    const permRegex = new RegExp(
      "\\[permiss(?:ão|ao):\\s*(?:uma vez|sempre)\\]\\s*" + _verb +
      "\\s+(?:\\x1b\\[[0-9;]*m)*([A-Za-z_][A-Za-z0-9_]*)"
    );

    function showPermModal(toolName) {
      permCurrentTool = toolName;
      permTool.textContent = toolName;
      permOverlay.classList.add("visible");
      permYes.disabled = false;
      permAlways.disabled = false;
      permNo.disabled = false;
    }

    function hidePermModal() {
      permOverlay.classList.remove("visible");
      permCurrentTool = null;
    }

    async function sendPermAnswer(answer) {
      const payload = { answer };
      if (answer === "yes_always" && permCurrentTool) payload.tool = permCurrentTool;
      permYes.disabled = true;
      permAlways.disabled = true;
      permNo.disabled = true;
      try {
        await fetch("/control/repl/permission", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      } catch (err) {
        console.error("[cockpit] envio de permissao falhou:", err);
      } finally {
        hidePermModal();
      }
    }

    permYes.addEventListener("click", () => sendPermAnswer("yes"));
    permAlways.addEventListener("click", () => sendPermAnswer("yes_always"));
    permNo.addEventListener("click", () => sendPermAnswer("no"));

    // Exposicao para validacao visual headless (PTY-PERMISSION-FLOW-01 proof).
    // NUNCA usado em runtime do REPL real -- apenas para injetar texto de
    // teste e capturar PNG do modal renderizado.
    window.__nyxPerm = { showPermModal, hidePermModal, scanForPermissionPrompt };

    function scanForPermissionPrompt(text) {
      // Mantém janela curta para casar marca quebrada em frames sucessivos.
      permBuffer = (permBuffer + text).slice(-512);
      const m = permRegex.exec(permBuffer);
      if (m && (!permOverlay.classList.contains("visible") || permCurrentTool !== m[1])) {
        showPermModal(m[1]);
        permBuffer = "";
      }
    }

    ws.onmessage = (e) => {
      if (typeof e.data === "string") {
        try {
          const meta = JSON.parse(e.data);
          if (meta.type === "replaced") {
            // UX-COCKPIT-PTY-HANDOVER-01: nova aba assumiu o PTY; esta sessao
            // foi substituida cleanly pelo servidor. Mensagem informativa, sem
            // erro vermelho.
            setStatus("info", "Sessao substituida por nova aba");
            return;
          }
          if (meta.type === "busy") {
            setStatus("busy", "PTY ocupado (outra sessao ativa)");
            term.write("\r\n\x1b[33m[cockpit] outra sessao PTY ativa. Aguarde ela fechar.\x1b[0m\r\n");
          } else if (meta.type === "error") {
            setStatus("error", "erro");
            term.write(`\r\n\x1b[31m[cockpit] erro: ${meta.message}\x1b[0m\r\n`);
          }
        } catch (_) {
          term.write(e.data);
          scanForPermissionPrompt(e.data);
        }
      } else {
        const bytes = new Uint8Array(e.data);
        term.write(bytes);
        try {
          scanForPermissionPrompt(new TextDecoder("utf-8", { fatal: false }).decode(bytes));
        } catch (_) {
          // decode silencioso: prompt CONFIRM_ONCE sempre vem em UTF-8.
        }
      }
    };
    ws.onclose = () => {
      setStatus("error", "desconectado");
      term.write("\r\n\x1b[90m[cockpit] WebSocket fechado.\x1b[0m\r\n");
    };
    ws.onerror = (e) => {
      setStatus("error", "erro WS");
      console.error("[cockpit] WS error:", e);
    };

    function bindTermData() {
      term.onData((d) => {
        if (ws.readyState !== WebSocket.OPEN) return;
        ws.send(new TextEncoder().encode(d));
      });
    }
    bindTermData();

    // TUI-FIX-WEB-RESIZE-TILING-01 (ONDA-34): recria o Terminal no resize.
    // pyte (emulador correto) renderiza os MESMOS bytes do Textual em 1 input;
    // o xterm.js só empilha ao redimensionar um alt-buffer EXISTENTE. Terminal
    // novo = estado da conexão inicial (sempre limpa). Textual não re-envia
    // ?1049h fora do boot -> reentramos no alt-screen manualmente; o frame full
    // do Textual (pós-SIGWINCH do sendResize) preenche o terminal fresco.
    function recreateTerminal() {
      // Computa cols/rows ANTES de dispose (mede a célula com o term atual) e
      // cria o terminal novo JÁ no tamanho alvo -- sem term.resize() depois,
      // que reintroduziria o bug de resize do alt-buffer no próprio fresco.
      const { cellW, cellH } = measureCell();
      const availW = Math.max(termContainer.clientWidth - 8, cellW * 20);
      const availH = Math.max(termContainer.clientHeight - 8, cellH * 5);
      const cols = Math.max(20, Math.floor(availW / cellW));
      const rows = Math.max(5, Math.floor(availH / cellH));
      try { term.dispose(); } catch (_) { /* ja disposed */ }
      term = new Terminal(Object.assign({}, TERM_OPTIONS, { cols, rows }));
      term.open(termContainer);
      bindTermData();
      term.write("\x1b[?1049h");
    }

    // COCKPIT-02: resize coordenado (xterm.js -> ws JSON meta)
    function sendResize() {
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: "resize", rows: term.rows, cols: term.cols }));
    }
    // UX-COCKPIT-FULLSCREEN-01: resize debounced -> recalcula cols/rows pelo
    // viewport via fitTerminal() e propaga via sendResize() para o PTY.
    let _resizeTimer = null;
    window.addEventListener("resize", () => {
      if (_resizeTimer !== null) clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => {
        recreateTerminal();   // terminal fresco JÁ no tamanho alvo (sem resize de buffer existente)
        sendResize();         // PTY -> SIGWINCH -> Textual manda frame full -> preenche o fresco limpo
        _resizeTimer = null;
      }, 80);
    });
  </script>
</body>
</html>
