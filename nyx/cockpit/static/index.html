<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nyx Cockpit -- Dashboard</title>
  <link rel="stylesheet" href="/static/app.css">
  <script defer src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="dashboard()" x-init="init()">
  <header class="header">
    <div class="brand">
      <span class="brand-mark">Nyx</span>
      <span class="brand-sub">cockpit / dashboard</span>
    </div>
    <nav class="links">
      <a href="/static/terminal.html">terminal</a>
      <a href="/api/features" target="_blank">api/features</a>
      <a href="/health" target="_blank">health</a>
    </nav>
  </header>

  <section class="summary">
    <span class="count" x-text="features.length"></span> features
    <span class="separator">|</span>
    <span class="status-pill ok"><span x-text="counters.ok"></span> ok</span>
    <span class="status-pill warn"><span x-text="counters.warn"></span> aviso</span>
    <span class="status-pill fail"><span x-text="counters.fail"></span> falha</span>
    <span class="status-pill unknown"><span x-text="counters.unknown"></span> sem teste</span>
    <span class="separator">|</span>
    <span class="muted" x-text="`${counters.running} rodando`"></span>
  </section>

  <section class="filters">
    <label>
      categoria
      <select x-model="filtro.categoria">
        <option value="">todas</option>
        <template x-for="cat in categorias" :key="cat">
          <option :value="cat" x-text="cat"></option>
        </template>
      </select>
    </label>
    <label>
      status
      <select x-model="filtro.status">
        <option value="">todos</option>
        <option value="ok">ok</option>
        <option value="warn">aviso</option>
        <option value="fail">falha</option>
        <option value="unknown">sem teste</option>
        <option value="running">rodando</option>
      </select>
    </label>
    <button @click="recarregar()" class="reload">recarregar</button>
  </section>

  <section class="grid">
    <template x-for="f in filtered" :key="f.id">
      <article class="card" :data-status="statusOf(f)">
        <header class="card-head">
          <span class="card-id" x-text="f.id"></span>
          <span class="badge" :data-status="statusOf(f)" x-text="statusLabel(f)"></span>
        </header>
        <p class="card-desc" x-text="f.descricao || f.titulo || '(sem descrição)'"></p>
        <footer class="card-foot">
          <span class="muted" x-text="`${f.componente || 'n/a'} | ${f.categoria || '?'}`"></span>
          <button @click="rodar(f.id)"
                  :disabled="!!running[f.id]"
                  x-text="running[f.id] ? 'rodando...' : 'rodar gauntlet'"
                  class="run-button"></button>
        </footer>
        <pre class="card-output" x-show="output[f.id]" x-text="output[f.id]"></pre>
      </article>
    </template>
  </section>

  <footer class="page-footer muted">
    <span>ADR-001 Local First | bind 127.0.0.1 | paleta D | Onda 24</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
