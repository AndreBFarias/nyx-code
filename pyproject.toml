[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-code"
version = "1.1.1"
description = "Agente de código local com Ollama"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [{name = "AndreBFarias"}]
keywords = ["code-agent", "ollama", "cli", "offline", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nyx = "nyx.__main__:main"

[project.urls]
Homepage = "https://github.com/AndreBFarias/nyx-code"
Repository = "https://github.com/AndreBFarias/nyx-code"
"Bug Tracker" = "https://github.com/AndreBFarias/nyx-code/issues"
Changelog = "https://github.com/AndreBFarias/nyx-code/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
