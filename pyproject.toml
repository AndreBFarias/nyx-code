[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-code"
dynamic = ["version"]
description = "Agente de código local com Ollama"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [{name = "AndreBFarias"}]
keywords = ["code-agent", "ollama", "cli", "offline", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
web = [
    "ddgs>=6.0.0",
    "html2text>=2024.2.26",
]

[project.scripts]
nyx = "nyx.__main__:main"

[project.urls]
Homepage = "https://github.com/AndreBFarias/nyx-code"
Repository = "https://github.com/AndreBFarias/nyx-code"
"Bug Tracker" = "https://github.com/AndreBFarias/nyx-code/issues"
Changelog = "https://github.com/AndreBFarias/nyx-code/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "nyx.__version__.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# RUFF-EXTERNAL-NOQA-CONFIG-01: `noqa-acento` é marker customizado do
# `~/.config/zsh/scripts/validar-acentuacao.py` (usado em palavras técnicas
# em PT-BR sem acento, ex: "sessao" como chave de dict). Ruff `external`
# silencia apenas CÓDIGOS custom desconhecidos (ex: `# noqa: XYZ`), não
# a sintaxe malformada (`# noqa-acento` sem `:`). Os warnings cosméticos
# persistem mas exit code do ruff continua 0 — não bloqueia o invariante
# #10 (que verifica exit code, não warnings).
external = ["noqa-acento"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
